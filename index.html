<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Guitar Flash - Mod Fiel 🔥</title>
    <style>
        body { 
            background-color: #000; 
            color: white; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
            flex-direction: column; 
            overflow: hidden;
            font-family: Arial, sans-serif;
        }
        
        /* Container centralizado com o fundo da banda Skillet */
        #jogoContainer {
            position: relative;
            width: 800px;
            height: 600px;
            border: 4px solid #333;
            background-image: url('https://alphacoders.com'); /* Foto clássica do Skillet */
            background-size: cover;
            background-position: center;
            box-shadow: 0 0 30px rgba(0,0,0,0.8);
        }

        canvas { 
            position: absolute;
            top: 0;
            left: 0;
            background-color: transparent; /* Pista fica por cima da imagem */
            z-index: 5;
        }

        /* Texto Clássico de Início */
        #textoInicio {
            position: absolute;
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: linear-gradient(180deg, #444, #111);
            border: 2px solid #666;
            border-radius: 15px;
            padding: 15px 30px;
            font-size: 26px;
            font-weight: bold;
            color: #ddd;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            z-index: 10;
            cursor: pointer;
            text-align: center;
        }

        /* Painel Superior do Guitar Flash */
        #infoSuperior {
            position: absolute;
            top: 10px;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 20px;
            box-sizing: border-box;
            font-size: 18px;
            font-weight: bold;
            text-shadow: 2px 2px 4px #000;
            z-index: 10;
        }
        #musicaNome { color: #fff; }
        #placar { color: #fff; }
    </style>
</head>
<body>

    <div id="jogoContainer">
        <!-- Informações superiores idênticas -->
        <div id="infoSuperior">
            <div id="musicaNome">Awake and Alive por Skillet</div>
            <div id="placar">PONTOS: 0</div>
        </div>

        <!-- Pop-up idêntico para iniciar -->
        <div id="textoInicio" onclick="iniciarJogo()">Aperte uma tecla<br>para começar</div>

        <!-- Tela do jogo com transparência para ver a banda de fundo -->
        <canvas id="telaJogo" width="800" height="600"></canvas>
    </div>

    <script>
        const canvas = document.getElementById("telaJogo");
        const ctx = canvas.getContext("2d");
        
        let jogando = false;
        let pontos = 0;
        let combo = 0;
        let notas = [];
        let particulasFogo = [];
        let teclasPressionadas = { a: false, s: false, j: false, k: false, l: false };

        // Configurações das 5 pistas e botões com perspectiva 3D
        // Cada botão tem sua posição na base (Y: 530)
        const botoesConfig = [
            { tecla: "a", corNormal: "#005500", corAtiva: "#00ff00", xBase: 250 }, // Verde
            { tecla: "s", corNormal: "#550000", corAtiva: "#ff0000", xBase: 325 }, // Vermelho
            { tecla: "j", corNormal: "#555500", corAtiva: "#ffff00", xBase: 400 }, // Amarelo
            { tecla: "k", corNormal: "#000055", corAtiva: "#0000ff", xBase: 475 }, // Azul
            { tecla: "l", corNormal: "#552200", corAtiva: "#ff6600", xBase: 550 }  // Laranja
        ];

        // Centro do topo de onde as notas brotam (Ponto de Fuga do 3D)
        const xTopoCentro = 400;
        const yTopo = 250;

        function iniciarJogo() {
            if (!jogando) {
                jogando = true;
                document.getElementById("textoInicio").style.display = "none";
                
                // Solta as notas coloridas de forma constante
                setInterval(function() {
                    let pistaRandom = Math.floor(Math.random() * 5);
                    notas.push({
                        pista: pistaRandom,
                        progresso: 0, // Vai de 0 (topo) até 1 (base dos botões)
                        velocidade: 0.015, // Velocidade de descida suave
                        cor: botoesConfig[pistaRandom].corAtiva
                    });
                }, 700);
            }
        }

        // Capturar teclado
        window.addEventListener("keydown", function(e) {
            let t = e.key.toLowerCase();
            if (teclasPressionadas.hasOwnProperty(t)) {
                if (!jogando) { iniciarJogo(); return; }
                if (!teclasPressionadas[t]) verificarAcerto(t);
                teclasPressionadas[t] = true;
            }
        });

        window.addEventListener("keyup", function(e) {
            let t = e.key.toLowerCase();
            if (teclasPressionadas.hasOwnProperty(t)) teclasPressionadas[t] = false;
        });

        function verificarAcerto(teclaApertada) {
            let acertou = false;
            for (let i = 0; i < notas.length; i++) {
                let n = notas[i];
                let config = botoesConfig[n.pista];
                
                if (config.tecla === teclaApertada) {
                    // Zona de acerto na perspectiva (progresso entre 0.88 e 0.98)
                    if (n.progresso >= 0.88 && n.progresso <= 0.98) {
                        pontos += 10;
                        combo++;
                        document.getElementById("placar").innerText = "PONTOS: " + pontos;
                        criarFogo(config.xBase, 530);
                        notas.splice(i, 1);
                        acertou = true;
                        break;
                    }
                }
            }
            if (!acertou) combo = 0;
        }

        function criarFogo(x, y) {
            const cores = ["#ff3300", "#ffaa00", "#ffff00", "#ffffff"];
            for (let i = 0; i < 15; i++) {
                particulasFogo.push({
                    x: x + (Math.random() - 0.5) * 30,
                    y: y,
                    vy: -Math.random() * 5 - 3,
                    vx: (Math.random() - 0.5) * 2,
                    vida: Math.random() * 15 + 10
                });
            }
        }

        // Desenho Principal com efeito de perspectiva 3D
        function loopJogo() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 1. Desenhar a Esteira/Pista 3D Cinza Escuro
            ctx.fillStyle = "rgba(25, 25, 25, 0.85)";
            ctx.beginPath();
            ctx.moveTo(370, yTopo); // Topo esquerdo estreito
            ctx.lineTo(430, yTopo); // Topo direito estreito
            ctx.lineTo(600, 570);  // Base direita larga
            ctx.lineTo(200, 570);  // Base esquerda larga
            ctx.closePath();
            ctx.fill();

            // Bordas laterais brilhantes da pista
            ctx.strokeStyle = "#fff";
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(370, yTopo); ctx.lineTo(200, 570);
            ctx.moveTo(430, yTopo); ctx.lineTo(600, 570);
            ctx.stroke();

            // Linhas divisórias das cordas na perspectiva 3D
            ctx.strokeStyle = "rgba(85, 85, 85, 0.5)";
            ctx.lineWidth = 2;
            for (let i = 1; i < 5; i++) {
                let xTopoL = 370 + (i * 12);
                let xBaseL = 200 + (i * 80);
                ctx.beginPath();
                ctx.moveTo(xTopoL, yTopo);
                ctx.lineTo(xBaseL, 570);
                ctx.stroke();
            }

            // 2. Desenhar os 5 Botões Alvo na Base (Estilo Guitar Flash)
            botoesConfig.forEach(b => {
                ctx.save();
                // Desenha o aro branco externo 3D achatado
                ctx.scale(1, 0.4); // Achata o círculo para dar sensação de ângulo deitada
                ctx.beginPath();
                ctx.arc(b.xBase, 530 / 0.4, 28, 0, Math.PI * 2);
                ctx.fillStyle = teclasPressionadas[b.tecla] ? b.corAtiva : b.corNormal;
                ctx.fill();
                ctx.strokeStyle = "#fff";
                ctx.lineWidth = 4;
                ctx.stroke();
                
                // Centro preto do botão igual ao original
                ctx.beginPath();
                ctx.arc(b.xBase, 530 / 0.4, 14, 0, Math.PI * 2);
                ctx.fillStyle = "#000";
                ctx.fill();
                ctx.restore();
            });

            // 3. Mover e Desenhar Notas com crescimento em Perspectiva
            for (let i = 0; i < notas.length; i++) {
                let n = notas[i];
                if (jogando) n.progresso += n.velocidade;

                // Fórmulas de Perspectiva 3D: calculam a posição X e Y reais com base no progresso
                let xPistaTopo = 370 + (n.pista * 12) + 6;
                let xPistaBase = 200 + (n.pista * 80) + 40;
                
                let xAtual = xPistaTopo + (xPistaBase - xPistaTopo) * n.progresso;
                let yAtual = yTopo + (530 - yTopo) * n.progresso;
                
                // A nota começa pequena (tamanho 4) e chega grande na base (tamanho 22)
                let tamanhoAtual = 4 + (18 * n.progresso);

                // Desenha a nota oval deitada em 3D
                ctx.save();
                ctx.scale(1, 0.45);
                ctx.beginPath();
                ctx.arc(xAtual, yAtual / 0.45, tamanhoAtual, 0, Math.PI * 2);
                ctx.fillStyle = n.cor;
                ctx.fill();
                ctx.strokeStyle = "#fff";
                ctx.lineWidth = 3;
                ctx.stroke();
                ctx.restore();
