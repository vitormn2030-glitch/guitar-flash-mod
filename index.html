<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Guitar Flash - Mod Fiel 🔥</title>
    <style>
        body { 
            background-color: #000; 
            color: white; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
            flex-direction: column; 
            overflow: hidden;
            font-family: Arial, sans-serif;
        }
        
        #jogoContainer {
            position: relative;
            width: 800px;
            height: 600px;
            border: 4px solid #333;
            background-color: #111;
            box-shadow: 0 0 30px rgba(0,0,0,0.8);
        }

        canvas { 
            position: absolute;
            top: 0;
            left: 0;
            background-color: transparent; 
            z-index: 5;
        }

        #textoInicio {
            position: absolute;
            top: 45%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: linear-gradient(180deg, #444, #111);
            border: 2px solid #666;
            border-radius: 15px;
            padding: 15px 30px;
            font-size: 26px;
            font-weight: bold;
            color: #ddd;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            z-index: 10;
            cursor: pointer;
            text-align: center;
            user-select: none;
        }

        #infoSuperior {
            position: absolute;
            top: 15px;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 30px;
            box-sizing: border-box;
            font-size: 20px;
            font-weight: bold;
            text-shadow: 2px 2px 4px #000;
            z-index: 10;
        }

        /* Tela de Game Over estilizada */
        #telaGameOver {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(200, 0, 0, 0.85);
            z-index: 20;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        #telaGameOver h1 { font-size: 60px; color: #fff; margin-bottom: 10px; text-shadow: 3px 3px #000; }
        #telaGameOver p { font-size: 24px; color: #eee; margin-bottom: 20px; }
        #btnReiniciar { background-color: #fff; color: #900; border: none; padding: 12px 30px; font-size: 20px; font-weight: bold; border-radius: 8px; cursor: pointer; }
        #btnReiniciar:hover { background-color: #eee; }
    </style>
</head>
<body>

    <div id="jogoContainer">
        <!-- Informações superiores -->
        <div id="infoSuperior">
            <div id="musicaNome">Awake and Alive por Skillet</div>
            <div id="placar">PONTOS: 0</div>
        </div>

        <!-- Botão clássico para começar -->
        <div id="textoInicio" onclick="iniciarJogo()">Aperte uma tecla<br>para começar</div>

        <!-- Tela de Game Over -->
        <div id="telaGameOver">
            <h1>GAME OVER</h1>
            <p id="pontosFinais">Você fez 0 pontos</p>
            <button id="btnReiniciar" onclick="reiniciarJogo()">TENTAR DE NOVO</button>
        </div>

        <canvas id="telaJogo" width="800" height="600"></canvas>
    </div>

    <script>
        let canvas, ctx;
        let jogando = false;
        let gameOver = false;
        let pontos = 0;
        let combo = 0;
        let notas = [];
        let particulasFogo = [];
        let teclasPressionadas = { a: false, s: false, j: false, k: false, l: false };
        
        // Nova variável de vida (vai de 0 a 100, começa em 50 no meio)
        let vida = 50; 
        let geradorNotasInterval;

        const botoesConfig = [
            { tecla: "a", corNormal: "#005500", corAtiva: "#00ff00", xBase: 280 }, 
            { tecla: "s", corNormal: "#550000", corAtiva: "#ff0000", xBase: 340 }, 
            { tecla: "j", corNormal: "#555500", corAtiva: "#ffff00", xBase: 400 }, 
            { tecla: "k", corNormal: "#000055", corAtiva: "#0000ff", xBase: 460 }, 
            { tecla: "l", corNormal: "#552200", corAtiva: "#ff6600", xBase: 520 }  
        ];

        const yTopo = 250;

        function iniciarJogo() {
            if (!jogando && !gameOver) {
                jogando = true;
                document.getElementById("textoInicio").style.display = "none";
                
                geradorNotasInterval = setInterval(function() {
                    if (!jogando) return;
                    let pistaRandom = Math.floor(Math.random() * 5);
                    notas.push({
                        pista: pistaRandom,
                        progresso: 0, 
                        velocidade: 0.015, 
                        cor: botoesConfig[pistaRandom].corAtiva
                    });
                }, 700);
            }
        }

        function dispararGameOver() {
            jogando = false;
            gameOver = true;
            clearInterval(geradorNotasInterval);
            document.getElementById("pontosFinais").innerText = "Você fez " + pontos + " pontos!";
            document.getElementById("telaGameOver").style.display = "flex";
        }

        function reiniciarJogo() {
            pontos = 0;
            combo = 0;
            vida = 50;
            notas = [];
            particulasFogo = [];
            gameOver = false;
            document.getElementById("placar").innerText = "PONTOS: 0";
            document.getElementById("telaGameOver").style.display = "none";
            jogando = true;
            iniciarJogo();
        }

        window.onload = function() {
            canvas = document.getElementById("telaJogo");
            ctx = canvas.getContext("2d");

            window.addEventListener("keydown", function(e) {
                let t = e.key.toLowerCase();
                if (teclasPressionadas.hasOwnProperty(t)) {
                    if (gameOver) return;
                    if (!jogando) { iniciarJogo(); return; }
                    if (!teclasPressionadas[t]) verificarAcerto(t);
                    teclasPressionadas[t] = true;
                }
            });

            window.addEventListener("keyup", function(e) {
                let t = e.key.toLowerCase();
                if (teclasPressionadas.hasOwnProperty(t)) teclasPressionadas[t] = false;
            });

            loopJogo();
        };

        function verificarAcerto(teclaApertada) {
            let acertou = false;
            for (let i = 0; i < notas.length; i++) {
                let n = notas[i];
                let config = botoesConfig[n.pista];
                
                if (config.tecla === teclaApertada) {
                    if (n.progresso >= 0.85 && n.progresso <= 0.98) {
                        pontos += 10;
                        combo++;
                        
                        // Acertou: ganha um pouco de vida (máximo 100)
                        vida = Math.min(100, vida + 4);
                        
                        document.getElementById("placar").innerText = "PONTOS: " + pontos;
                        criarFogo(config.xBase, 530);
                        notas.splice(i, 1);
                        acertou = true;
                        break;
                    }
                }
            }
            if (!acertou) {
                combo = 0;
                // Errou a palhetada: perde vida!
                vida = Math.max(0, vida - 5);
                if (vida <= 0) dispararGameOver();
            }
        }

        function criarFogo(x, y) {
            const cores = ["#ff3300", "#ffaa00", "#ffff00", "#ffffff"];
            for (let i = 0; i < 15; i++) {
                particulasFogo.push({
                    x: x + (Math.random() - 0.5) * 20,
                    y: y,
                    vy: -Math.random() * 5 - 3,
                    vx: (Math.random() - 0.5) * 2,
                    vida: Math.random() * 15 + 10
                });
            }
        }

        function loopJogo() {
            if (!ctx) {
                requestAnimationFrame(loopJogo);
                return;
            }

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 1. Pista Cone
            ctx.fillStyle = "rgba(20, 20, 20, 0.9)";
            ctx.beginPath();
            ctx.moveTo(375, yTopo); 
            ctx.lineTo(425, yTopo); 
            ctx.lineTo(560, 560);  
            ctx.lineTo(240, 560);  
            ctx.closePath();
            ctx.fill();

            ctx.strokeStyle = "rgba(255, 255, 255, 0.8)";
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(375, yTopo); ctx.lineTo(240, 560);
            ctx.moveTo(425, yTopo); ctx.lineTo(560, 560);
            ctx.stroke();

            for (let i = 1; i < 5; i++) {
                let xTopoL = 375 + (i * 10);
                let xBaseL = 240 + (i * 64);
                ctx.beginPath();
                ctx.moveTo(xTopoL, yTopo);
                ctx.lineTo(xBaseL, 560);
                ctx.stroke();
            }

            // DESENHAR BARRA DE ENERGIA VERTICAL (Estilo Guitar Flash)
            // Moldura Prata da Barra
            ctx.fillStyle = "#888";
            ctx.fillRect(590, 300, 25, 200);
            ctx.strokeStyle = "#fff";
            ctx.lineWidth = 2;
            ctx.strokeRect(590, 300, 25, 200);

            // Fundo interno preto da barra
            ctx.fillStyle = "#000";
            ctx.fillRect(593, 303, 19, 194);

            // Preenchimento colorido dinâmico baseado na Vida atual do jogador
            let alturaVida = (vida / 100) * 194;
            // Se a vida tiver alta fica verde, se tiver média amarela, se tiver baixa vermelha
            if (vida > 60) { ctx.fillStyle = "#00ff00"; }
